<svg xmlns="http://www.w3.org/2000/svg" width="960" height="175" viewBox="0 0 960 175" role="img" aria-labelledby="title desc">
  <title id="title">Mohamed Yassine EL HADRI — Portfolio Banner</title>
  <desc id="desc">Dark slate header banner featuring Mohamed Yassine EL HADRI, Computer Science Engineering at ENSA Tangier, with flowing tech accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#132e3d"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="175" rx="16" fill="url(#bg)"/>
  <rect width="958" height="173" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Geometric Grid & Waves -->
  <g fill="none" stroke="url(#line)" opacity=".22">
    <path d="M0 135 Q160 55 320 135 T640 135 T960 135"/>
    <path d="M0 147 Q160 67 320 147 T640 147 T960 147"/>
    <path d="M0 159 Q160 79 320 159 T640 159 T960 159"/>
    <path d="M740 0v175M780 0v175M820 0v175M860 0v175M900 0v175M940 0v175" opacity=".2"/>
  </g>

  <!-- Name -->
  <text x="480" y="64" text-anchor="middle" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">Mohamed Yassine EL HADRI</text>

  <!-- Degree & School -->
  <text x="480" y="100" text-anchor="middle" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">Computer Science Engineering Student · ENSA Tangier</text>

  <!-- Core Pillars -->
  <text x="480" y="132" text-anchor="middle" font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="3" fill="#5eead4">DATA &amp; AI · BACKEND ENGINEERING · CLOUD &amp; DEVOPS</text>

  <!-- Glowing Animated Pulse Dots -->
  <circle cx="58" cy="42" r="4.5" fill="#38bdf8">
    <animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="902" cy="132" r="5" fill="#5eead4">
    <animate attributeName="opacity" values="1;.3;1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="920" cy="35" r="3" fill="#818cf8">
    <animate attributeName="opacity" values=".2;.8;.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
</svg>
